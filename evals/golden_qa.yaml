  # ======================================================================
  # automated - the second line of defence behind the header guards.
  # The guard cases carry the headers that should have caught them first.
  # ======================================================================

  - id: automated-newsletter-01
    language: en
    expected_category: automated
    expected_tier: skip
    subject: Your weekly digest is here
    headers:
      Precedence: bulk
      List-Id: <digest.newsletter.example.com>
      List-Unsubscribe: <https://newsletter.example.com/u/1>
    text: |
      This week in nonprofit news. Unsubscribe at any time.
    note: Caught by the Precedence and List-* guards before any model call.

  - id: automated-vacation-01
    language: en
    expected_category: automated
    expected_tier: skip
    subject: "Automatic reply: Volunteering with Vietnam Hearts"
    headers:
      Auto-Submitted: auto-replied
      X-Auto-Response-Suppress: All
    text: |
      I am out of the office until next Monday and will reply on my return.
    note: >
      The loop case. An auto-reply that gets a holding message back is how a
      two-machine mail loop starts.

  - id: automated-bounce-01
    language: en
    expected_category: automated
    expected_tier: skip
    subject: Delivery Status Notification (Failure)
    headers:
      Auto-Submitted: auto-generated
      From: mailer-daemon@example.com
    text: |
      Your message could not be delivered to one or more recipients.

  - id: automated-receipt-01
    language: en
    expected_category: automated
    expected_tier: skip
    subject: Your order has shipped
    headers:
      Auto-Submitted: auto-generated
      Precedence: bulk
    text: |
      Your order is on its way. This mailbox is not monitored.

  - id: automated-calendar-01
    language: en
    expected_category: automated
    expected_tier: skip
    subject: "Invitation: Volunteer catch-up"
    headers:
      Auto-Submitted: auto-generated
    text: |
      You have been invited to an event. Yes / No / Maybe.

  - id: automated-security-01
    language: en
    expected_category: automated
    expected_tier: skip
    subject: New sign-in to your account
    headers:
      Precedence: bulk
      From: no-reply@accounts.example.com
    text: |
      We noticed a new sign-in. If this was you, no action is needed.

  - id: automated-promotions-01
    language: en
    expected_category: automated
    expected_tier: skip
    subject: 50% off English textbooks this week only
    label_ids: [INBOX, CATEGORY_PROMOTIONS]
    text: |
      Our biggest sale of the year. Shop now.
    note: Caught by Gmail's own CATEGORY_PROMOTIONS label rather than by a header.

  - id: automated-vi-01
    language: vi
    expected_category: automated
    expected_tier: skip
    subject: Thông báo tự động
    headers:
      Auto-Submitted: auto-replied
    text: |
      Đây là thư trả lời tự động. Mình đang đi công tác đến tuần sau.
    note: >
      The Vietnamese automated case. Without it the automated category is only
      ever measured in English, and the skip tier is the one that produces no
      reply at all.

  - id: automated-vi-02
    language: vi
    expected_category: automated
    expected_tier: skip
    subject: Bản tin tuần này
    headers:
      Precedence: bulk
      List-Unsubscribe: <https://newsletter.example.com/u/2>
    text: |
      Bản tin tuần này của chúng tôi. Nhấn vào đây để hủy đăng ký.

  # ======================================================================
  # language handling - "other" forces needs_admin through derive_tier rule 3
  # ======================================================================

  - id: other-language-01
    language: other
    expected_category: signup
    expected_tier: needs_admin
    subject: Bénévolat avec Vietnam Hearts
    text: |
      Bonjour, je souhaiterais faire du bénévolat avec vous. Comment puis-je
      m'inscrire ?
    must_not_answer: [anything at all]
    note: >
      Answerable in substance, escalated on language alone. Proves rule 3 fires
      before the category's own tier, so a French sign-up gets a person and the
      English holding message rather than a Vietnamese template.

