# Golden set for the volunteer inbox triage and answer evaluation.
#
# Every case is written for this file. No real volunteer's name, address, or
# words appear anywhere in it, and nothing is derived from the signup responses
# sheet. Where a case needs to look like real mail it is a plausible
# composition, not a copy.
#
# Fields
#   id                        unique, stable; referenced by the reports
#   language                  en | vi | other - what the sender actually wrote in
#   subject, text             the mail
#   headers                   only for the deterministic-guard cases
#   expected_category         one of the eleven categories
#   expected_tier             derived, and validated against derive_tier() in CI
#   expected_asks_for_human   default false
#   expected_mentions_money   default false
#   must_mention              facts a correct auto_answer has to contain
#   must_not_answer           things no reply may ever state
#   note                      why the case exists, when that is not obvious
#
# The tier is never hand-chosen: tests/test_evals_loader.py recomputes it from
# the expected signals with derive_tier() and fails on a mismatch, so this file
# cannot drift from the policy it is measuring.

cases:

  # ======================================================================
  # signup - the dominant inbound question, answered from a fixed template
  # ======================================================================

  - id: signup-en-01
    language: en
    expected_category: signup
    expected_tier: auto_answer
    subject: Volunteering with Vietnam Hearts
    text: |
      Hello,

      I am moving to Ho Chi Minh City next month and would love to help with
      your English classes. How do I sign up?

      Thanks a lot!
    must_mention: [teaching days, class time, signup form link]
    must_not_answer: [acceptance, response time]

